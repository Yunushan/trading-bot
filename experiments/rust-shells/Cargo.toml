[package]
name = "trading-bot-rust"
version = "1.0.41"
edition = "2024"
license = "0BSD"
publish = false

[workspace]
resolver = "2"
members = [
    ".",
    "crates/contracts",
    "crates/core",
    "apps/tauri-desktop",
]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1", features = ["std"] }
sha2 = "0.11"
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tauri = { version = "2" }
tauri-build = { version = "2" }

# plist 1.8.0 pins vulnerable quick-xml 0.38.x on the macOS Tauri path. The
# upstream project has the compatible quick-xml 0.41.0 remediation on this
# reviewed commit but has not published it to crates.io yet.
[patch.crates-io]
plist = { git = "https://github.com/ebarnard/rust-plist", rev = "2881e175b61f159a8a958765168733c0d5abe641" }
# Tauri's GTK3/WebKitGTK dependency path still requires glib 0.18.5. The
# published crate contains an unsound immutable pointer passed to a C
# out-parameter, while the upstream fix is not released on the 0.18 line.
# Keep the published package version and provenance, but use the exact
# upstream fix in the tracked backport under vendor/ until the dependency
# graph moves to glib >=0.20 or Tauri adopts its GTK4 path.
glib = { path = "../../vendor/glib-0.18.5" }

[dependencies]
serde_json = { workspace = true }
trading-bot-core = { path = "crates/core" }
