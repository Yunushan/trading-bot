name: Release Linux and macOS Binaries

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_linux:
        description: "Build Linux assets"
        type: boolean
        default: true
      build_macos:
        description: "Build macOS assets (regular runners only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-linux-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.build_linux == 'true' ||
      github.event.inputs.build_macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            platform: linux
            os: ubuntu-24.04
            qt_host: linux
            qt_arch: linux_gcc_64
            artifact_name: linux-x64-release-assets
          - id: linux-arm64
            platform: linux
            os: ubuntu-24.04-arm
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
            artifact_name: linux-arm64-release-assets
          - id: macos-14-arm64
            platform: macos
            os: macos-14
            qt_host: mac
            qt_arch: clang_64
            artifact_name: macos14-arm64-release-assets
          - id: macos-15-intel
            platform: macos
            os: macos-15-intel
            qt_host: mac
            qt_arch: clang_64
            artifact_name: macos15-intel-release-assets
          - id: macos-15-arm64
            platform: macos
            os: macos-15
            qt_host: mac
            qt_arch: clang_64
            artifact_name: macos15-arm64-release-assets
          - id: macos-26-arm64
            platform: macos
            os: macos-26
            qt_host: mac
            qt_arch: clang_64
            artifact_name: macos26-arm64-release-assets
    env:
      TB_PLATFORM: ${{ matrix.platform }}
      TB_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      TB_ASSET_LABEL: ${{ matrix.id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          # The QA note may name a tested revision older than the tagged metadata commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            Languages/Python/requirements.txt
            Languages/Python/pyproject.toml

      - name: Validate tagged release QA sign-off
        if: github.ref_type == 'tag'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_QA_NOTE: docs/release-qa/${{ github.ref_name }}.md
        run: |
          set -euo pipefail
          python tools/check_release_qa.py \
            --tag "${RELEASE_TAG}" \
            --note "${RELEASE_QA_NOTE}" \
            --require-current-revision \
            --allow-release-qa-commit \
            --require-platform-evidence-run

      - name: Validate tagged release metadata versions
        if: github.ref_type == 'tag'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/check_release_version.py --tag "${RELEASE_TAG}"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libminizip1t64 \
            libasound2t64 \
            libdbus-1-3 \
            libegl1 \
            libgbm1 \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libxcomposite1 \
            libxdamage1 \
            libxdo-dev \
            libxkbcommon-x11-0 \
            libxrandr2 \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            patchelf \
            rpm \
            ruby \
            ruby-dev \
            wget
          sudo gem install --no-document fpm

      - name: Install Qt 6
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.11.0"
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtwebengine qtwebsockets qtwebchannel qtpositioning
          setup-python: false

      - name: Resolve Qt CMake path
        shell: bash
        run: |
          set -euo pipefail
          qt_prefix="$(qmake -query QT_INSTALL_PREFIX)"
          echo "QT_CMAKE_DIR=${qt_prefix}/lib/cmake/Qt6" >> "${GITHUB_ENV}"

      - name: Install Python dependencies
        shell: bash
        working-directory: Languages/Python
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.packaging.txt
          python -m pip install --prefer-binary -r requirements.txt

      - name: Build Python binary
        shell: bash
        run: |
          set -euo pipefail
          bash Languages/Python/tools/build_binary.sh \
            --python python \
            --name Trading-Bot-Python \
            --skip-dependency-install \
            --release-tag "${TB_RELEASE_TAG}"

      - name: Build required Rust binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path experiments/rust-shells/Cargo.toml --locked --release \
            --package trading-bot-rust

      - name: Build required Tauri desktop binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path experiments/rust-shells/Cargo.toml --locked --release \
            --package trading-bot-tauri-desktop

      - name: Configure C++ build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "experiments/native-cpp" \
                -B "build/binance_cpp" \
                -DCMAKE_BUILD_TYPE=Release \
                -DTB_CXX_STANDARD=23 \
                -DQt6_DIR="${QT_CMAKE_DIR}" \
                -DTB_REQUIRE_QT_WEBENGINE=ON \
                -DTB_ENABLE_QT_DEPLOY_SCRIPT=OFF

      - name: Build C++ binary
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "build/binance_cpp" --config Release --parallel

      - name: Install C++ runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          install_prefix="${GITHUB_WORKSPACE}/release/Trading-Bot-C++"
          rm -rf "${install_prefix}"
          cmake --install "build/binance_cpp" --config Release --prefix "${install_prefix}"

      - name: Deploy macOS Qt frameworks
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app_bundle="${GITHUB_WORKSPACE}/release/Trading-Bot-C++/Trading-Bot-C++.app"
          qt_prefix="$(qmake -query QT_INSTALL_PREFIX)"
          macdeployqt="${qt_prefix}/bin/macdeployqt"
          if [[ ! -x "${macdeployqt}" ]]; then
            echo "macdeployqt was not found at ${macdeployqt}" >&2
            exit 1
          fi
          if [[ ! -d "${app_bundle}" ]]; then
            echo "Packaged C++ app bundle was not found at ${app_bundle}" >&2
            exit 1
          fi
          "${macdeployqt}" "${app_bundle}" -always-overwrite "-libpath=${qt_prefix}/lib"
          if [[ ! -d "${app_bundle}/Contents/Frameworks/QtConcurrent.framework" ]]; then
            echo "macdeployqt did not embed QtConcurrent.framework in ${app_bundle}" >&2
            exit 1
          fi
          cpp_bin="${app_bundle}/Contents/MacOS/Trading-Bot-C++"
          embedded_rpath="@executable_path/../Frameworks"
          has_embedded_rpath() {
            otool -l "$1" | awk -v expected="$2" '
              $1 == "cmd" && $2 == "LC_RPATH" { in_rpath=1; next }
              in_rpath && $1 == "path" {
                if ($2 == expected) found=1
                in_rpath=0
                next
              }
              in_rpath && $1 == "cmd" { in_rpath=0 }
              END { exit(found ? 0 : 1) }
            '
          }
          if ! has_embedded_rpath "${cpp_bin}" "${embedded_rpath}"; then
            install_name_tool -add_rpath "${embedded_rpath}" "${cpp_bin}"
          fi
          if ! has_embedded_rpath "${cpp_bin}" "${embedded_rpath}"; then
            echo "macOS app binary is missing the embedded-framework LC_RPATH." >&2
            exit 1
          fi
          if ! otool -L "${cpp_bin}" | grep -Fq "@rpath/QtConcurrent.framework/"; then
            echo "macOS app binary is not linked against the embedded QtConcurrent framework." >&2
            exit 1
          fi

      - name: Developer ID-sign required macOS release binaries
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        shell: bash
        env:
          MACOS_CODESIGN_P12_B64: ${{ secrets.MACOS_CODESIGN_P12_B64 }}
          MACOS_CODESIGN_P12_PASSWORD: ${{ secrets.MACOS_CODESIGN_P12_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          bash tools/sign_macos_release.sh "${{ matrix.id }}"

      - name: Notarize and staple the macOS C++ app bundle
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        shell: bash
        env:
          APPLE_NOTARY_KEY_B64: ${{ secrets.APPLE_NOTARY_KEY_B64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          bash tools/notarize_macos_release.sh \
            staple-app \
            "${{ matrix.id }}" \
            "${{ github.sha }}"

      - name: Smoke packaged native binaries
        shell: bash
        run: |
          set -euo pipefail
          rust_bin="experiments/rust-shells/target/release/trading-bot-rust"
          tauri_bin="experiments/rust-shells/target/release/trading-bot-tauri-desktop"
          if [[ ! -x "${tauri_bin}" ]]; then
            echo "Packaged Tauri executable not found or not executable at ${tauri_bin}" >&2
            exit 1
          fi
          # Tauri regenerates these tracked platform schemas while compiling the
          # desktop binary. Restore the checked-in contract before requiring a
          # clean source tree for signed package smoke evidence.
          git restore --source=HEAD -- experiments/rust-shells/apps/tauri-desktop/gen/schemas
          python tools/write_rust_package_smoke_evidence.py \
            --rust-cli "${rust_bin}" \
            --tauri-desktop "${tauri_bin}" \
            --output "release/rust-package-smoke-${{ matrix.id }}.json" \
            --source-revision "${GITHUB_SHA}" \
            --platform "${TB_PLATFORM}" \
            --architecture "$(uname -m)" \
            --require-clean-source

          cpp_root="release/Trading-Bot-C++"
          if [[ "$(uname -s)" == "Darwin" ]]; then
            cpp_bin="${cpp_root}/Trading-Bot-C++.app/Contents/MacOS/Trading-Bot-C++"
          else
            cpp_bin="${cpp_root}/bin/Trading-Bot-C++"
          fi
          if [[ ! -x "${cpp_bin}" ]]; then
            echo "Packaged C++ executable not found or not executable at ${cpp_bin}" >&2
            exit 1
          fi
          QT_QPA_PLATFORM=offscreen "${cpp_bin}" --smoke

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/package_linux_macos_release.sh

      - name: Notarize final macOS release archives
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        shell: bash
        env:
          APPLE_NOTARY_KEY_B64: ${{ secrets.APPLE_NOTARY_KEY_B64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          bash tools/notarize_macos_release.sh \
            archives \
            "${{ matrix.id }}" \
            "${{ github.sha }}"

      - name: Write and verify artifact digest manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="release/release-manifest-${{ matrix.id }}.json"
          artifacts=()
          for artifact in release/*; do
            [[ -f "${artifact}" ]] || continue
            case "${artifact}" in
              release/release-manifest-*.json) continue ;;
            esac
            artifacts+=("${artifact}")
          done
          if [[ "${#artifacts[@]}" -eq 0 ]]; then
            echo "No release artifacts were found to include in the digest manifest." >&2
            exit 1
          fi
          python tools/write_release_manifest.py "${artifacts[@]}" --output "${manifest}" --repo-root "${GITHUB_WORKSPACE}"
          python tools/write_release_manifest.py --verify "${manifest}" --repo-root "${GITHUB_WORKSPACE}" --require-current-revision

      - name: Generate SPDX SBOM for release assets
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release
          format: spdx-json
          output-file: release/release-sbom-${{ matrix.id }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest release asset provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*

      - name: Attest release asset SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*
          sbom-path: release/release-sbom-${{ matrix.id }}.spdx.json

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*
          if-no-files-found: error

  publish-release:
    permissions:
      actions: read
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    concurrency:
      group: release-publish-${{ github.ref_name }}
      cancel-in-progress: false
      queue: max
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Python verification dependencies
        shell: bash
        working-directory: Languages/Python
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt

      - name: Verify required release platform evidence
        id: release_platform_evidence
        uses: ./.github/actions/verify-release-platform-evidence
        with:
          tag: ${{ github.ref_name }}
          note: docs/release-qa/${{ github.ref_name }}.md

      - name: Restore tagged release checkout
        shell: bash
        run: git checkout --detach "${GITHUB_SHA}"

      - name: Download built assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-release-assets"
          merge-multiple: true
          path: release

      - name: Verify downloaded release assets
        shell: bash
        run: |
          set -euo pipefail
          count_regular_files() {
            local count=0 path
            for path in "$@"; do
              [[ -f "${path}" ]] || continue
              count=$((count + 1))
            done
            printf '%s\n' "${count}"
          }
          manifest_count="$(count_regular_files release/release-manifest-*.json)"
          sbom_count="$(count_regular_files release/release-sbom-*.spdx.json)"
          signing_count="$(count_regular_files release/release-signing-macos-*.json)"
          if [[ "$manifest_count" -ne 6 ]]; then
            echo "Expected six Linux/macOS release manifests, found $manifest_count." >&2
            exit 1
          fi
          if [[ "$sbom_count" -ne 6 ]]; then
            echo "Expected six Linux/macOS release SBOMs, found $sbom_count." >&2
            exit 1
          fi
          if [[ "$signing_count" -ne 4 ]]; then
            echo "Expected four macOS native-signing evidence files, found $signing_count." >&2
            exit 1
          fi
          for manifest in release/release-manifest-*.json; do
            [[ -f "$manifest" ]] || continue
            python tools/write_release_manifest.py \
              --verify "${manifest}" \
              --repo-root "${GITHUB_WORKSPACE}" \
              --require-current-revision
          done
          python tools/check_release_signing_evidence.py \
            release/release-signing-macos-*.json \
            --asset-dir release \
            --require-complete-platform-set macos \
            --require-current-revision
          ls -lah release

      - name: Require mutable prerelease candidate state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_OWNER: ${{ github.repository_owner }}
          RELEASE_REPO: ${{ github.event.repository.name }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_release_publication_state.py \
            --tag "${RELEASE_TAG}" \
            --owner "${RELEASE_OWNER}" \
            --repo "${RELEASE_REPO}"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          prerelease: true
          make_latest: false
          files: release/*
