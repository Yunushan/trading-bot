name: Rust Native Runtime Promotion Audit

"on":
  workflow_dispatch:
    inputs:
      live_smoke_run_id:
        description: "Actions run id that uploaded rust-native-live-smoke-evidence."
        required: true
        type: string
      release_evidence_run_id:
        description: "Actions run id that uploaded rust-native-release-platform-evidence."
        required: true
        type: string
      evidence_dir:
        description: "Canonical runtime evidence directory used by the promotion audit."
        required: true
        default: "artifacts/rust-native-runtime-evidence"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  promotion-audit:
    name: Strict Rust Native Runtime Promotion Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    env:
      LIVE_SMOKE_RUN_ID: ${{ inputs.live_smoke_run_id }}
      RELEASE_EVIDENCE_RUN_ID: ${{ inputs.release_evidence_run_id }}
      RUST_NATIVE_RUNTIME_EVIDENCE_DIR: ${{ github.workspace }}/${{ inputs.evidence_dir }}
      RUST_NATIVE_RUNTIME_EVIDENCE_INPUT: ${{ inputs.evidence_dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            Languages/Python/pyproject.toml

      - name: Install native parity dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "./Languages/Python"

      - name: Install Rust native promotion dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: |
            experiments/rust-shells -> target

      - name: Validate promotion audit inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${LIVE_SMOKE_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "live_smoke_run_id must be a numeric GitHub Actions run id." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_EVIDENCE_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "release_evidence_run_id must be a numeric GitHub Actions run id." >&2
            exit 1
          fi
          if [[ -z "${RUST_NATIVE_RUNTIME_EVIDENCE_INPUT}" ]]; then
            echo "evidence_dir input is required for Rust native promotion audit." >&2
            exit 1
          fi
          if [[ ! "${RUST_NATIVE_RUNTIME_EVIDENCE_INPUT}" =~ ^artifacts/rust-native-runtime-evidence(/[A-Za-z0-9._-]+)*$ ]]; then
            echo "evidence_dir must stay under artifacts/rust-native-runtime-evidence and use safe path segments." >&2
            exit 1
          fi

      - name: Verify external evidence run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="${GITHUB_SHA:-}"
          if [[ ! "${current_sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "current GitHub commit is not a full SHA." >&2
            exit 1
          fi

          verify_run() {
            local run_id="$1"
            local expected_workflow="$2"
            local evidence_label="$3"
            local run_metadata
            run_metadata="$(
              gh run view "${run_id}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json databaseId,status,conclusion,headSha,workflowName
            )"
            printf '%s' "${run_metadata}" | \
              EXPECTED_RUN_ID="${run_id}" \
              EXPECTED_WORKFLOW="${expected_workflow}" \
              EVIDENCE_LABEL="${evidence_label}" \
              EXPECTED_SHA="${current_sha}" \
              python -c '
          import json
          import os
          import re
          import sys

          metadata = json.load(sys.stdin)
          expected_id = os.environ["EXPECTED_RUN_ID"]
          expected_workflow = os.environ["EXPECTED_WORKFLOW"]
          evidence_label = os.environ["EVIDENCE_LABEL"]
          expected_sha = os.environ["EXPECTED_SHA"].strip().lower()
          database_id = str(metadata.get("databaseId") or "")
          status = str(metadata.get("status") or "")
          conclusion = str(metadata.get("conclusion") or "")
          head_sha = str(metadata.get("headSha") or "").strip().lower()
          workflow_name = str(metadata.get("workflowName") or "").strip()

          if database_id != expected_id:
              raise SystemExit(f"{evidence_label} run metadata returned a different run id")
          if status != "completed" or conclusion != "success":
              raise SystemExit(
                  f"{evidence_label} run must be completed successfully "
                  f"(status={status!r}, conclusion={conclusion!r})"
              )
          if not re.fullmatch(r"[0-9a-f]{40}", expected_sha):
              raise SystemExit("current GitHub commit is not a full SHA")
          if not re.fullmatch(r"[0-9a-f]{40}", head_sha):
              raise SystemExit(f"{evidence_label} run headSha is not a full SHA")
          if head_sha != expected_sha:
              raise SystemExit(
                  f"{evidence_label} run headSha must match the current promotion commit"
              )
          if workflow_name != expected_workflow:
              raise SystemExit(
                  f"{evidence_label} run workflow must be {expected_workflow!r}; "
                  f"observed {workflow_name!r}"
              )
          print(
              f"Verified {evidence_label} run {database_id}: "
              f"workflow={workflow_name!r}, headSha={head_sha}"
          )
          '
          }

          verify_run "${LIVE_SMOKE_RUN_ID}" "Rust Native Live Smoke Evidence" "live smoke evidence"
          verify_run "${RELEASE_EVIDENCE_RUN_ID}" "Rust Native Release Evidence" "release evidence"

      - name: Audit native source sync
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-source-sync
          python tools/audit_native_source_sync.py --json --output artifacts/native-source-sync/native-source-sync-audit.json

      - name: Upload native source sync audit
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-source-sync-audit
          path: artifacts/native-source-sync/native-source-sync-audit.json
          if-no-files-found: warn

      - name: Download external Rust native evidence artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          download_dir="${RUST_NATIVE_RUNTIME_EVIDENCE_DIR}/downloads"
          mkdir -p "${download_dir}/live-smoke" "${download_dir}/release-evidence"
          gh run download "${LIVE_SMOKE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name rust-native-live-smoke-evidence \
            --dir "${download_dir}/live-smoke"
          gh run download "${RELEASE_EVIDENCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name rust-native-release-platform-evidence \
            --dir "${download_dir}/release-evidence"

      - name: Import external Rust native evidence artifacts
        shell: bash
        run: |
          set -euo pipefail
          python tools/import_rust_native_evidence_artifacts.py \
            "${RUST_NATIVE_RUNTIME_EVIDENCE_DIR}/downloads" \
            artifacts/native-source-sync \
            --apply \
            --overwrite \
            --require-current-commit \
            --require-clean-source \
            --require-native-source-sync-audit \
            --require-runtime-id rust-native-live-market-data-smoke \
            --require-runtime-id rust-native-live-account-read-smoke \
            --require-runtime-id rust-native-release-platform-evidence \
            --runtime-evidence-dir "${RUST_NATIVE_RUNTIME_EVIDENCE_DIR}" \
            --json

      - name: Generate deterministic local recovery evidence for checked commit
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_rust_native_local_recovery_evidence.py \
            --evidence-dir "${RUST_NATIVE_RUNTIME_EVIDENCE_DIR}" \
            --require-clean-source \
            --require-native-source-sync \
            --json

      - name: Validate complete current-commit runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_rust_native_runtime_evidence.py \
            --require-evidence \
            --require-current-commit \
            --require-clean-source \
            --evidence-dir "${RUST_NATIVE_RUNTIME_EVIDENCE_DIR}"

      - name: Run strict Rust native runtime promotion readiness audit
        shell: bash
        run: |
          set -euo pipefail
          python tools/audit_rust_native_runtime_readiness.py \
            --require-ready \
            --json \
            --evidence-dir "${RUST_NATIVE_RUNTIME_EVIDENCE_DIR}"

      - name: Write final Rust native runtime evidence plan
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUST_NATIVE_RUNTIME_EVIDENCE_DIR}"
          python tools/audit_rust_native_runtime_readiness.py \
            --json \
            --evidence-dir "${RUST_NATIVE_RUNTIME_EVIDENCE_DIR}" \
            --write-evidence-plan "${RUST_NATIVE_RUNTIME_EVIDENCE_DIR}/rust-native-runtime-evidence-plan.md"

      - name: Upload final Rust native runtime evidence plan
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-native-promotion-evidence-plan
          path: ${{ inputs.evidence_dir }}/rust-native-runtime-evidence-plan.md
          if-no-files-found: warn

      - name: Upload normalized Rust native runtime promotion evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-native-runtime-promotion-evidence
          path: |
            ${{ inputs.evidence_dir }}/rust-native-live-market-data-smoke.json
            ${{ inputs.evidence_dir }}/rust-native-live-account-read-smoke.json
            ${{ inputs.evidence_dir }}/rust-native-live-stream-recovery.json
            ${{ inputs.evidence_dir }}/rust-native-order-guard-recovery.json
            ${{ inputs.evidence_dir }}/rust-native-release-platform-evidence.json
            artifacts/native-source-sync/native-source-sync-audit.json
          if-no-files-found: warn
