name: Supply Chain Security

on:
  pull_request:
    paths:
      - "Languages/Python/**"
      - "apps/web-dashboard/**"
      - "apps/mobile-client/**"
      - "experiments/rust-shells/**"
      - "docker/**"
      - ".github/dependabot.yml"
      - ".github/workflows/supply-chain-security.yml"
  push:
    branches: [main]
    paths:
      - "Languages/Python/**"
      - "apps/web-dashboard/**"
      - "apps/mobile-client/**"
      - "experiments/rust-shells/**"
      - "docker/**"
      - ".github/dependabot.yml"
      - ".github/workflows/supply-chain-security.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-vulnerability-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Languages/Python/pyproject.toml

      - name: Create isolated Python audit environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .ci-python-audit
          .ci-python-audit/bin/python -m pip install --upgrade pip==26.2.1 setuptools==83.0.0 wheel
          .ci-python-audit/bin/python -m pip install -e "./Languages/Python[service,security]"

      - name: Audit Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          .ci-python-audit/bin/python tools/run_python_security_audit.py --skip-editable --progress-spinner=off

  node-vulnerability-audit:
    name: Node Dependency Audit (${{ matrix.client }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        client:
          - apps/web-dashboard
          - apps/mobile-client
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: ${{ matrix.client }}/package-lock.json

      - name: Install production Node dependencies
        shell: bash
        working-directory: ${{ matrix.client }}
        run: |
          set -euo pipefail
          npm ci --omit=dev --ignore-scripts

      - name: Audit production Node dependencies
        shell: bash
        working-directory: ${{ matrix.client }}
        run: |
          set -euo pipefail
          audit_file="$(mktemp)"
          trap 'rm -f "$audit_file"' EXIT
          audit_status=0
          npm audit --omit=dev --audit-level=high --json > "$audit_file" || audit_status=$?
          node ../../tools/check_node_audit_policy.cjs \
            --report "$audit_file" \
            --policy ../../tools/node-audit-policy.json \
            --project "${{ matrix.client }}"
          if [[ "$audit_status" -gt 1 ]]; then
            echo "npm audit did not complete successfully (exit code $audit_status)." >&2
            exit "$audit_status"
          fi
          echo "npm audit exit code: $audit_status (policy evaluation is authoritative)"

  rust-vulnerability-audit:
    name: Rust Dependency Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install pinned cargo-audit
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        id: rust-audit
        shell: bash
        working-directory: experiments/rust-shells
        run: |
          set -euo pipefail
          audit_db="$(mktemp -d "$RUNNER_TEMP/trading-bot-rustsec-db.XXXXXX")"
          audit_report="$RUNNER_TEMP/rust-dependency-audit.json"
          trap 'rm -rf "$audit_db"' EXIT
          : > "$audit_report"
          audit_status=0
          cargo audit --db "$audit_db" --file Cargo.lock --format json > "$audit_report" || audit_status=$?
          cat "$audit_report"
          if [[ "$audit_status" -ne 0 ]]; then
            echo "cargo audit failed with exit code $audit_status; see the uploaded JSON report." >&2
            exit "$audit_status"
          fi

      - name: Upload Rust dependency audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-dependency-audit-report
          path: ${{ runner.temp }}/rust-dependency-audit.json
          if-no-files-found: error

  container-vulnerability-audit:
    name: Container Image Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Build service container image
        id: image-build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker build --pull --provenance=false --sbom=false --file docker/backend.Dockerfile --tag trading-bot-service:supply-chain .; then
              exit 0
            fi

            if [[ "$attempt" == "3" ]]; then
              exit 1
            fi

            sleep "$((attempt * 10))"
          done

      - name: Audit service container image
        if: steps.image-build.outcome == 'success'
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: trading-bot-service:supply-chain
          format: json
          output: trivy-service-results.json
          exit-code: "1"
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln

      - name: Summarize container findings
        if: always() && steps.trivy.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          python tools/summarize_trivy_report.py trivy-service-results.json

      - name: Upload container vulnerability report
        if: always() && steps.trivy.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-vulnerability-report
          path: trivy-service-results.json
          if-no-files-found: warn

      - name: Enforce container vulnerability policy
        if: steps.trivy.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo "Container image contains HIGH or CRITICAL vulnerabilities. See container-vulnerability-report." >&2
          exit 1
