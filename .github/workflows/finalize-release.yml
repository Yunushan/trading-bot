name: Finalize Stable Release

"on":
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  finalize-release:
    permissions:
      actions: read
      contents: write
    concurrency:
      group: release-publish-${{ github.ref_name }}
      cancel-in-progress: false
      queue: max
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require a tag dispatch
        shell: bash
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_REF_TYPE}" != "tag" ]]; then
            echo "Stable release finalization must be dispatched from a version tag." >&2
            exit 1
          fi

      - name: Checkout tagged release
        uses: actions/checkout@de0fac2e4500dabe0009f9f3cf4f9c185c862e55 # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate tagged release metadata versions
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/check_release_version.py --tag "${RELEASE_TAG}"

      - name: Verify required release platform evidence
        id: release_platform_evidence
        uses: ./.github/actions/verify-release-platform-evidence
        with:
          tag: ${{ github.ref_name }}
          note: docs/release-qa/${{ github.ref_name }}.md

      - name: Require full release-platform scope
        shell: bash
        env:
          RELEASE_EVIDENCE_SCOPE: ${{ steps.release_platform_evidence.outputs.evidence_scope }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_EVIDENCE_SCOPE}" != "full" ]]; then
            echo "Only full release-platform evidence may become stable/latest." >&2
            exit 1
          fi

      - name: Restore tagged release checkout
        shell: bash
        run: git checkout --detach "${GITHUB_SHA}"

      - name: Verify exact-tag packaging workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_BUILD_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          verify_packaging_workflow() {
            local workflow_file="$1" workflow_path="$2"
            gh api \
              --method GET \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              -f "head_sha=${RELEASE_BUILD_REVISION}" \
              -f "status=completed" \
              -f "per_page=100" \
              "repos/${RELEASE_REPOSITORY}/actions/workflows/${workflow_file}/runs" | \
            python tools/check_release_workflow_run_set.py - \
              --expected-repository "${RELEASE_REPOSITORY}" \
              --expected-head-sha "${RELEASE_BUILD_REVISION}" \
              --expected-workflow-path "${workflow_path}"
          }
          verify_packaging_workflow \
            release-windows.yml \
            .github/workflows/release-windows.yml
          verify_packaging_workflow \
            release-linux-macos.yml \
            .github/workflows/release-linux-macos.yml

      - name: Verify complete prerelease candidate asset matrix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_OWNER: ${{ github.repository_owner }}
          RELEASE_REPO: ${{ github.event.repository.name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_BUILD_REVISION: ${{ github.sha }}
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}/stable-release-manifests
        run: |
          set -euo pipefail
          python tools/check_release_assets.py "${RELEASE_TAG}" \
            --owner "${RELEASE_OWNER}" \
            --repo "${RELEASE_REPO}" \
            --require-prerelease-candidate
          mkdir -p "${RELEASE_MANIFEST_DIR}"
          gh release download "${RELEASE_TAG}" \
            --repo "${RELEASE_REPOSITORY}" \
            --pattern "release-manifest-*.json" \
            --dir "${RELEASE_MANIFEST_DIR}"
          gh api \
            --method GET \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${RELEASE_REPOSITORY}/releases/tags/${RELEASE_TAG}" | \
          python tools/check_release_candidate_manifests.py - \
            --manifest-dir "${RELEASE_MANIFEST_DIR}" \
            --tag "${RELEASE_TAG}" \
            --expected-source-revision "${RELEASE_BUILD_REVISION}"

      - name: Promote complete candidate to stable latest release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
