name: Update LOC Snapshot

on:
  pull_request:
    branches:
      - main
    paths:
      - "**"
      - ".github/workflows/update-loc-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-readme-loc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Check README LOC snapshot
        shell: bash
        run: |
          set -euo pipefail
          python tools/update_loc_snapshot.py --readme README.md --check
