name: PyQt6 Future Compatibility

"on":
  workflow_dispatch:
    inputs:
      pyqt_version:
        description: "Exact stable PyQt6 release to validate"
        required: true
        default: "6.12.0"
        type: string
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  pyqt6-future-compatibility:
    name: PyQt6 ${{ inputs.pyqt_version || '6.12.0' }} compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      QT_QPA_PLATFORM: offscreen
      PYQT6_TARGET: ${{ inputs.pyqt_version || '6.12.0' }}
      PYQT6_PLATFORM: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            Languages/Python/pyproject.toml

      - name: Check whether the requested PyQt6 release is published
        id: pyqt6_release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen

          target = os.environ["PYQT6_TARGET"].strip()
          target_match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", target)
          if target_match is None:
              raise SystemExit(f"Invalid PyQt6 target version {target!r}; use MAJOR.MINOR.PATCH")
          target_series = (int(target_match.group(1)), int(target_match.group(2)))
          platform_name = os.environ["PYQT6_PLATFORM"].strip()
          platform_wheel_markers = {
              "ubuntu-24.04": ("manylinux_", "linux_"),
              "windows-2025": ("win_amd64",),
              "macos-15": ("macosx_",),
          }
          wheel_markers = platform_wheel_markers.get(platform_name)
          if wheel_markers is None:
              raise SystemExit(f"Unsupported PyQt6 compatibility runner {platform_name!r}")

          def stable_series(version):
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", str(version or ""))
              return (int(match.group(1)), int(match.group(2))) if match else None

          def has_installable_wheel(files):
              for file_info in files:
                  filename = str(file_info.get("filename") or "").lower()
                  if file_info.get("packagetype") != "bdist_wheel":
                      continue
                  if not filename.endswith(".whl") or file_info.get("yanked", False):
                      continue
                  platform_part = filename[:-4].rsplit("-", 1)[-1]
                  if any(
                      platform_tag.startswith(marker)
                      for platform_tag in platform_part.split(".")
                      for marker in wheel_markers
                  ):
                      return True
              return False

          def available_releases(package_name):
              request = Request(
                  f"https://pypi.org/pypi/{package_name}/json",
                  headers={"User-Agent": "trading-bot-pyqt6-future-compatibility"},
              )
              with urlopen(request, timeout=20) as response:  # noqa: S310 - fixed HTTPS PyPI endpoint
                  payload = json.load(response)
              releases = payload.get("releases", {})
              if package_name == "PyQt6":
                  files = releases.get(target, [])
                  return has_installable_wheel(files)
              return any(
                  stable_series(version) == target_series
                  and has_installable_wheel(files)
                  for version, files in releases.items()
              )

          package_status = {
              package_name: available_releases(package_name)
              for package_name in (
                  "PyQt6",
                  "PyQt6-Qt6",
                  "PyQt6-WebEngine",
                  "PyQt6-WebEngine-Qt6",
              )
          }
          available = all(package_status.values())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"available={'true' if available else 'false'}\n")
          print(
              f"PyQt6 {target_series[0]}.{target_series[1]} family status for {platform_name}: "
              + ", ".join(
                  f"{package_name}={'published' if is_available else 'not yet published'}"
                  for package_name, is_available in package_status.items()
              )
              + "."
          )
          PY

      - name: Report that the scheduled target is not published yet
        if: steps.pyqt6_release.outputs.available != 'true' && github.event_name == 'schedule'
        run: echo "::notice::PyQt6 ${PYQT6_TARGET} is not published yet; future compatibility validation will run when the release appears."

      - name: Fail manual dispatch when the requested family is unavailable
        if: steps.pyqt6_release.outputs.available != 'true' && github.event_name == 'workflow_dispatch'
        run: |
          echo "::error::PyQt6 ${PYQT6_TARGET} is not available as a complete published family yet."
          exit 1

      - name: Install Linux Qt runtime dependencies
        if: matrix.os == 'ubuntu-24.04' && steps.pyqt6_release.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libasound2t64 \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgbm1 \
            libglib2.0-0 \
            libgtk-3-0 \
            libopengl0 \
            libxcomposite1 \
            libxdamage1 \
            libxkbcommon-x11-0 \
            libxrandr2 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xkb1

      - name: Install the project and requested PyQt6 release
        if: steps.pyqt6_release.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target_series_start="${PYQT6_TARGET%.*}.0"
          python -m pip install --upgrade pip
          python -m pip install -r "Languages/Python/requirements.packaging.txt"
          python -m pip install -e "./Languages/Python[desktop,service,dev]"
          python -m pip install --only-binary=:all: \
            "PyQt6==${PYQT6_TARGET}" \
            "PyQt6-WebEngine>=${target_series_start},<6.13.0" \
            "PyQt6-Qt6>=${target_series_start},<6.13.0" \
            "PyQt6-WebEngine-Qt6>=${target_series_start},<6.13.0"

      - name: Validate the requested PyQt6 runtime contract
        if: steps.pyqt6_release.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_pyqt6_compatibility.py --require-exact-pyqt6-version "${PYQT6_TARGET}" --json

      - name: Smoke-test the canonical desktop entrypoint
        if: steps.pyqt6_release.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python apps/desktop-pyqt/main.py --smoke

      - name: Smoke-test the canonical desktop window surface
        if: steps.pyqt6_release.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python apps/desktop-pyqt/main.py --smoke-window

      - name: Smoke-test the QtWebEngine page lifecycle
        if: steps.pyqt6_release.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python apps/desktop-pyqt/main.py --smoke-webengine

      - name: Build and smoke-test frozen Windows executable
        if: steps.pyqt6_release.outputs.available == 'true' && matrix.os == 'windows-2025'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $distPath = Join-Path $env:RUNNER_TEMP "trading-bot-pyqt6-future-dist"
          $workPath = Join-Path $env:RUNNER_TEMP "trading-bot-pyqt6-future-build"
          ./Languages/Python/tools/build_exe.ps1 `
            -Python python `
            -Name "Trading-Bot-PyQt6-$env:PYQT6_TARGET" `
            -SkipDependencyInstall `
            -DistPath $distPath `
            -WorkPath $workPath

      - name: Run focused PyQt6 compatibility tests
        if: steps.pyqt6_release.outputs.available == 'true'
        shell: bash
        working-directory: Languages/Python
        run: |
          set -euo pipefail
          python -m pytest \
            tests/test_pyqt6_compatibility.py \
            tests/test_dependency_versions_requirements.py \
            -q \
            -p no:cacheprovider \
            --no-cov
