name: PyQt6 Future Compatibility

"on":
  workflow_dispatch:
    inputs:
      pyqt_version:
        description: "PyQt6 release series to validate"
        required: true
        default: "6.12.0"
        type: string

permissions:
  contents: read

jobs:
  pyqt6-future-compatibility:
    name: PyQt6 ${{ inputs.pyqt_version }} compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PYQT6_TARGET: ${{ inputs.pyqt_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            Languages/Python/pyproject.toml

      - name: Install Linux Qt runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libasound2t64 \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgbm1 \
            libglib2.0-0 \
            libgtk-3-0 \
            libopengl0 \
            libxcomposite1 \
            libxdamage1 \
            libxkbcommon-x11-0 \
            libxrandr2 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xkb1

      - name: Install the project and requested PyQt6 release
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "./Languages/Python[desktop,service,dev]"
          python -m pip install --pre --only-binary=:all: \
            "PyQt6==${PYQT6_TARGET}" \
            "PyQt6-WebEngine>=${PYQT6_TARGET},<6.13.0" \
            "PyQt6-Qt6>=${PYQT6_TARGET},<6.13.0"

      - name: Validate the requested PyQt6 runtime contract
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_pyqt6_compatibility.py --require-version "${PYQT6_TARGET}" --json

      - name: Smoke-test the canonical desktop entrypoint
        shell: bash
        run: |
          set -euo pipefail
          python apps/desktop-pyqt/main.py --smoke

      - name: Run focused PyQt6 compatibility tests
        shell: bash
        working-directory: Languages/Python
        run: |
          set -euo pipefail
          python -m pytest \
            tests/test_pyqt6_compatibility.py \
            tests/test_dependency_versions_requirements.py \
            -q \
            -p no:cacheprovider \
            --no-cov
