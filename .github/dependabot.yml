version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: "/Languages/Python"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      binance-sdk:
        patterns:
          - "binance-sdk-derivatives-trading-usds-futures"
          - "binance-sdk-derivatives-trading-coin-futures"
          - "binance-sdk-spot"

  - package-ecosystem: npm
    directory: "/apps/web-dashboard"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: "/apps/mobile-client"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: cargo
    directory: "/experiments/rust-shells"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
